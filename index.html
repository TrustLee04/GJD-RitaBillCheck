<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Litaco Bill Image Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --ok: #16a34a;
      --err: #dc2626;
      --input-bg: #f9fafb;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --ok: #22c55e;
      --err: #f87171;
      --input-bg: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      transition: background 0.2s, color 0.2s;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { font-size: 20px; margin: 0; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea { min-height: 170px; font-family: ui-monospace, Consolas, monospace; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
    .progress-wrap {
      margin-top: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      height: 10px;
    }
    .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s; }
    .log {
      margin-top: 16px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--input-bg);
      font-size: 13px;
      line-height: 1.6;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Litaco Bill Image Downloader</h1>
      <button class="secondary" id="themeBtn" type="button">Dark Mode</button>
    </div>

    <label for="workerUrl">Cloudflare Worker Proxy URL</label>
    <input id="workerUrl" type="text" placeholder="https://lita-bill-proxy.your-name.workers.dev" />

    <label for="codesInput">Dán cột mã đơn từ Excel (mỗi mã 1 dòng)</label>
    <textarea id="codesInput" placeholder="E60118927&#10;E60119002&#10;TW261020418"></textarea>

    <div class="actions">
      <button id="startBtn" type="button">Bắt đầu tải (1.jpg, 2.jpg...)</button>
      <button id="zipBtn" class="secondary" type="button" disabled>Tải tất cả (.zip)</button>
      <span id="statusText" style="font-size: 13px; color: var(--muted);"></span>
    </div>

    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="log" id="logBox">Sẵn sàng...</div>
  </div>

  <script>
    const workerInput = document.getElementById("workerUrl");
    const codesInput = document.getElementById("codesInput");
    const startBtn = document.getElementById("startBtn");
    const zipBtn = document.getElementById("zipBtn");
    const themeBtn = document.getElementById("themeBtn");
    const progressBar = document.getElementById("progressBar");
    const statusText = document.getElementById("statusText");
    const logBox = document.getElementById("logBox");

    let collectedFiles = []; // [{ name: "1.jpg", blob }]

    // Khôi phục theme và Worker URL đã lưu
    const savedTheme = localStorage.getItem("litaco_theme") || "light";
    setTheme(savedTheme);
    workerInput.value = localStorage.getItem("litaco_worker_url") || "";

    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      setTheme(next);
      localStorage.setItem("litaco_theme", next);
    });

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeBtn.textContent = theme === "dark" ? "Light Mode" : "Dark Mode";
    }

    function addLog(msg, cls = "") {
      const div = document.createElement("div");
      if (cls) div.className = cls;
      div.textContent = msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    startBtn.addEventListener("click", async () => {
      const baseWorker = workerInput.value.trim().replace(/\/+$/, "");
      const codes = codesInput.value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);

      if (!baseWorker) {
        alert("Vui lòng nhập Cloudflare Worker URL trước.");
        return;
      }
      if (!codes.length) {
        alert("Vui lòng dán ít nhất 1 mã đơn.");
        return;
      }

      localStorage.setItem("litaco_worker_url", baseWorker);
      collectedFiles = [];
      zipBtn.disabled = true;
      startBtn.disabled = true;
      logBox.innerHTML = "";
      progressBar.style.width = "0%";

      let fileIndex = 1;
      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        statusText.textContent = `Đang xử lý ${i + 1}/${codes.length}: ${code}`;

        try {
          const postRes = await fetch(baseWorker + "/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "code_bill=" + encodeURIComponent(code),
          });

          if (!postRes.ok) {
            throw new Error("HTTP " + postRes.status);
          }

          const htmlText = await postRes.text();
          const doc = new DOMParser().parseFromString(htmlText, "text/html");
          const imgEl = doc.querySelector("img.billStatus");
          const rawSrc = imgEl ? (imgEl.getAttribute("data-srcimg") || imgEl.getAttribute("src") || "").trim() : "";

          if (!rawSrc) {
            addLog(`[${code}] Không tìm thấy ảnh billStatus`, "err");
          } else {
            const fullImgUrl = new URL(rawSrc, "https://www.lita.com.vn/en/tracking/").href;
            const imgRes = await fetch(`${baseWorker}/image?url=${encodeURIComponent(fullImgUrl)}`);
            if (!imgRes.ok) throw new Error("Lỗi tải ảnh HTTP " + imgRes.status);

            const blob = await imgRes.blob();
            const fileName = `${fileIndex}.jpg`;
            collectedFiles.push({ name: fileName, blob });
            triggerDownload(blob, fileName);
            addLog(`[${code}] -> Tải ${fileName} thành công`, "ok");
            fileIndex++;
          }
        } catch (err) {
          addLog(`[${code}] Lỗi: ${err.message}`, "err");
        }

        progressBar.style.width = `${Math.round(((i + 1) / codes.length) * 100)}%`;
        await new Promise((r) => setTimeout(r, 400));
      }

      statusText.textContent = `Hoàn tất! Đã tải ${collectedFiles.length} ảnh.`;
      if (collectedFiles.length > 0) zipBtn.disabled = false;
      startBtn.disabled = false;
    });

    zipBtn.addEventListener("click", async () => {
      if (!collectedFiles.length) return;
      const zip = new JSZip();
      for (const item of collectedFiles) {
        zip.file(item.name, item.blob);
      }
      const content = await zip.generateAsync({ type: "blob" });
      triggerDownload(content, "litaco_bills.zip");
    });
  </script>
</body>
</html>
